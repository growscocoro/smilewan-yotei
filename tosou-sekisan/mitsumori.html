<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>見積書をつくる</title>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 14px 110px; background: #f1f3f4; color: #202124; font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif; font-size: 16px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; color: #1a3a5f; margin: 4px 2px 12px; }
  h2 { font-size: 16px; color: #1a3a5f; margin: 20px 2px 8px; padding-left: 9px; border-left: 5px solid #1a3a5f; }
  .card { background: #fff; border: 1px solid #dadce0; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  label { display: block; font-size: 13px; color: #5f6368; margin: 8px 0 3px; }
  label:first-child { margin-top: 0; }
  input, select, textarea { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #c0c4c9; border-radius: 8px; background: #fffde7; font-family: inherit; color: #202124; }
  textarea { min-height: 64px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; min-width: 0; }
  .narrow { flex: 0 0 76px !important; }
  button { font-size: 16px; font-family: inherit; border-radius: 8px; padding: 11px 14px; border: 1px solid #1a3a5f; background: #fff; color: #1a3a5f; font-weight: bold; }
  button.main { background: #1a3a5f; color: #fff; width: 100%; font-size: 18px; padding: 14px; }
  button:disabled { opacity: .5; }
  .line .top { display: flex; align-items: center; gap: 8px; }
  .line .no { font-weight: bold; color: #1a3a5f; flex: 0 0 26px; }
  .line .del { flex: 0 0 auto; border-color: #c0c4c9; color: #c5221f; padding: 8px 10px; font-size: 14px; }
  .amt { text-align: right; font-weight: bold; margin-top: 8px; font-size: 16px; }
  .amt small { color: #5f6368; font-weight: normal; }
  .warn { color: #b06000; font-size: 13px; margin-top: 4px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #dadce0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 640px; margin: 0 auto; }
  .tot { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .tot b { font-size: 22px; color: #c5221f; }
  .tot span { font-size: 13px; color: #5f6368; }
  #msg { white-space: pre-wrap; color: #c5221f; font-size: 14px; margin: 8px 2px; }
  #done { display: none; }
  #done .big { font-size: 24px; font-weight: bold; margin: 8px 0; }
  a.open { display: block; text-align: center; background: #1a3a5f; color: #fff; text-decoration: none; font-weight: bold; border-radius: 8px; padding: 14px; font-size: 18px; margin: 12px 0; }
  .note { font-size: 13px; color: #5f6368; }
</style>
</head>
<body>
<div class="wrap">
  <h1>見積書をつくる</h1><div style="font-size:14px;margin:0 2px 10px;"><a href="./" style="color:#1a73e8;">積算のページへ</a>　｜　<a href="settei.html" style="color:#1a73e8;">設定（項目の単価・自社の情報）</a>　｜　<a href="rireki.html" style="color:#1a73e8;">つくった見積書</a></div>
  <div id="gate">
    <div class="card">
      <label style="display:block;font-size:13px;color:#5f6368;margin-bottom:4px;">合言葉</label>
      <input type="text" id="gatePass" autocomplete="off" autocapitalize="off" style="-webkit-text-security:disc;width:100%;font-size:16px;padding:10px;border:1px solid #c0c4c9;border-radius:8px;">
      <button id="gateGo" type="button" style="width:100%;margin-top:12px;font-size:18px;font-weight:bold;color:#fff;background:#1a3a5f;border:0;border-radius:8px;padding:14px;">開く</button>
      <div id="gateMsg" style="white-space:pre-wrap;color:#c5221f;font-size:14px;margin-top:10px;"></div>
    </div>
  </div>
  <div id="form" style="display:none;">
    <div id="nocompany" class="card warn" style="display:none;">自社の情報（会社名など）がまだ入っていません。このまま作ると、見積書に会社名・住所・電話が出ません。</div>

    <div class="card">
      <div class="row">
        <div><label>宛名</label><input id="to" list="custs" placeholder="例：○○株式会社" autocomplete="off"></div>
        <div class="narrow"><label>敬称</label><select id="keisho"><option>御中</option><option>様</option></select></div>
      </div>
      <datalist id="custs"></datalist>
      <label>件名（工事名）</label><input id="title" placeholder="例：○○邸 外壁塗装工事">
      <label>工事場所</label><input id="place">
    </div>

    <h2>明細</h2>
    <div class="card">
      <label>ひな形からまとめて入れる</label>
      <div class="row">
        <div><select id="tpl"></select></div>
        <div style="flex:0 0 auto;"><button type="button" id="tplBtn">入れる</button></div>
      </div>
    </div>
    <datalist id="items"></datalist>
    <div id="lines"></div>
    <button type="button" id="add" style="width:100%;">＋ 行を足す</button>

    <h2>そのほか（空でも作れます）</h2>
    <div class="card">
      <label>値引き（円）</label><input id="discount" inputmode="numeric">
      <label>工期</label><input id="kouki" placeholder="例：着工から約14日">
      <label>お支払い条件</label><input id="pay" placeholder="例：完了後 翌月末 お振込み">
      <label>有効期限</label><input id="limit">
      <label>備考</label><textarea id="note"></textarea>
    </div>
    <div id="msg"></div>
  </div>

  <div id="done" class="card">
    <div>見積書ができました</div>
    <div id="dNo" class="note"></div>
    <div id="dTo"></div>
    <div class="big" id="dTotal"></div>
    <a class="open" id="dUrl" target="_blank">見積書を開く（印刷・PDFに保存）</a>
    <div class="note">控えを残しました。開いた画面で「印刷する／PDFに保存する」を押すと、PDFにできます。</div>
    <button type="button" id="again" style="width:100%;margin-top:14px;">次の見積をつくる</button>
  </div>
</div>

<div class="bar" id="bar" style="display:none;"><div class="in">
  <div class="tot"><span id="sub">小計 0 ／ 消費税 0</span><span>合計（税込） <b id="total">¥0</b></span></div>
  <button type="button" class="main" id="make">見積書をつくる（PDF）</button>
</div></div>

<script>
function esc_(s) {
  return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function mitsuCalc_(rows, ratePct, discount) {
  var lines = [], errors = [], sub = 0;
  var blank = function (v) { return v === '' || v === null || v === undefined; };
  rows.forEach(function (r, i) {
    var name = String(blank(r[0]) ? '' : r[0]).trim(), spec = String(blank(r[1]) ? '' : r[1]).trim();
    var qty = r[2], unit = String(blank(r[3]) ? '' : r[3]).trim(), price = r[4];
    var hasQ = !blank(qty), hasP = !blank(price), at = '明細の' + (i + 1) + '行目';
    if (!name && !spec && !hasQ && !hasP && !unit) return;
    if (!name) { errors.push(at + '：項目が空です'); return; }
    if (!hasQ && !hasP) { lines.push({ head: true, name: name, spec: spec }); return; }
    if (!hasQ) { errors.push(at + '「' + name + '」：数量が空です'); return; }
    if (!hasP) { errors.push(at + '「' + name + '」：単価が空です'); return; }
    if (typeof qty !== 'number' || typeof price !== 'number' || isNaN(qty) || isNaN(price)) { errors.push(at + '「' + name + '」：数量と単価は数字で入れてください'); return; }
    var amount = Math.round(qty * price);
    sub += amount;
    lines.push({ head: false, name: name, spec: spec, qty: qty, unit: unit, price: price, amount: amount });
  });
  var rate = blank(ratePct) ? 10 : Number(ratePct);
  if (isNaN(rate) || rate < 0) { errors.push('消費税率は数字で入れてください'); rate = 0; }
  var disc = blank(discount) ? 0 : Number(discount);
  if (isNaN(disc) || disc < 0) { errors.push('値引きは0以上の数字で入れてください'); disc = 0; }
  if (disc > sub) errors.push('値引きが小計より大きくなっています');
  var tax = Math.floor((sub - disc) * rate / 100 + 1e-9);
  return { lines: lines, errors: errors, sub: sub, discount: disc, tax: tax, total: sub - disc + tax, rate: rate };
}
function mitsuYen_(n) {
  var s = String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (n < 0 ? '-' : '') + '¥' + s;
}
function mitsuNum_(n) {
  var p = String(n).split('.');
  return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p[1] ? '.' + p[1] : '');
}
function mitsuHtml_(d) {
  var c = d.calc, me = d.me || {}, h = [], bill = d.kind === 'seikyu';
  var B = 'border:1px solid #777777;', P = 'padding:5px 7px;';
  var th = function (t, w) { return '<td style="' + B + P + 'background:#e8eef5;color:#111111;font-weight:bold;text-align:center;' + (w ? 'width:' + w + ';' : '') + '">' + t + '</td>'; };
  var td = function (t, align, extra) { return '<td style="' + B + P + 'text-align:' + (align || 'left') + ';' + (extra || '') + '">' + t + '</td>'; };

  h.push('<html><head><meta charset="UTF-8"><style>@page{size:A4;margin:14mm 13mm;} body{font-family:sans-serif;font-size:10.5pt;color:#111111;-webkit-print-color-adjust:exact;print-color-adjust:exact;} table{border-collapse:collapse;}</style></head><body>');
  h.push('<div style="text-align:center;font-size:22pt;font-weight:bold;letter-spacing:8pt;border-bottom:3px double #1a3a5f;padding-bottom:6px;margin-bottom:14px;">' + (bill ? '御 請 求 書' : '御 見 積 書') + '</div>');

  // 上段：左＝宛名と合計、右＝番号・日付・自社
  h.push('<table style="width:100%;"><tr><td style="width:56%;vertical-align:top;">');
  h.push('<div style="font-size:15pt;font-weight:bold;border-bottom:1px solid #111111;padding-bottom:4px;">' + esc_(d.to) + '　' + esc_(d.keisho) + '</div>');
  h.push('<div style="margin-top:10px;">' + (bill ? '下記のとおり、ご請求申し上げます。' : '下記のとおり、お見積り申し上げます。') + '</div>');
  h.push('<table style="width:95%;margin-top:12px;"><tr>' +
    '<td style="' + B + 'padding:9px 10px;background:#e8eef5;color:#111111;font-weight:bold;width:36%;text-align:center;">' + (bill ? '御請求金額' : '御見積金額') + '<br><span style="font-size:8.5pt;">（税込）</span></td>' +
    '<td style="' + B + 'padding:9px 12px;font-size:18pt;font-weight:bold;text-align:right;">' + mitsuYen_(c.total) + ' －</td></tr></table>');
  h.push('</td><td style="width:44%;vertical-align:top;font-size:10pt;">');
  h.push('<div style="text-align:right;">' + (bill ? '請求番号' : '見積番号') + '　' + esc_(d.no) + '</div><div style="text-align:right;">' + (bill ? '請求日' : '見積日') + '　' + esc_(d.date) + '</div>');
  h.push('<div style="margin-top:12px;font-size:13pt;font-weight:bold;">' + esc_(me['会社名'] || '') + '</div>');
  var addr = [me['郵便番号'] ? '〒' + String(me['郵便番号']).replace(/^〒/, '') : '', me['住所'] || ''].filter(String).join('　');
  if (addr) h.push('<div>' + esc_(addr) + '</div>');
  var tel = [me['電話'] ? 'TEL ' + me['電話'] : '', me['FAX'] ? 'FAX ' + me['FAX'] : ''].filter(String).join('　');
  if (tel) h.push('<div>' + esc_(tel) + '</div>');
  if (me['メール']) h.push('<div>' + esc_(me['メール']) + '</div>');
  if (me['担当者']) h.push('<div>担当　' + esc_(me['担当者']) + '</div>');
  if (me['登録番号（インボイス）']) h.push('<div>登録番号　' + esc_(me['登録番号（インボイス）']) + '</div>');
  if (me['建設業許可']) h.push('<div>建設業許可　' + esc_(me['建設業許可']) + '</div>');
  h.push('</td></tr></table>');

  // 件名など
  var info = (bill ? [['件名', d.title], ['工事場所', d.place], ['お支払期限', d.due]]
    : [['件名', d.title], ['工事場所', d.place], ['工期', d.kouki], ['有効期限', d.limit], ['お支払い条件', d.pay]]).filter(function (x) { return x[1]; });
  if (info.length) {
    h.push('<table style="width:100%;margin-top:14px;">');
    info.forEach(function (x) {
      h.push('<tr><td style="' + B + P + 'background:#e8eef5;font-weight:bold;width:18%;">' + x[0] + '</td>' + td(esc_(x[1])) + '</tr>');
    });
    h.push('</table>');
  }

  // 明細
  h.push('<table style="width:100%;margin-top:14px;font-size:10pt;"><tr>' + th('No', '5%') + th('項目', '25%') + th('仕様・内容', '26%') + th('数量', '9%') + th('単位', '7%') + th('単価', '14%') + th('金額', '14%') + '</tr>');
  var no = 0;
  c.lines.forEach(function (l) {
    if (l.head) {
      h.push('<tr><td colspan="7" style="' + B + P + 'background:#f1f3f4;font-weight:bold;">' + esc_(l.name) + (l.spec ? '　' + esc_(l.spec) : '') + '</td></tr>');
      return;
    }
    no++;
    h.push('<tr>' + td(no, 'center') + td(esc_(l.name)) + td(esc_(l.spec)) + td(mitsuNum_(l.qty), 'right') + td(esc_(l.unit), 'center') +
      td(mitsuNum_(l.price), 'right') + td(mitsuNum_(l.amount), 'right') + '</tr>');
  });
  var sum = function (label, val, bold) {
    return '<tr><td colspan="5" style="border:none;"></td>' + td(label, 'center', 'background:#e8eef5;font-weight:bold;') +
      td(val, 'right', bold ? 'font-weight:bold;font-size:11.5pt;' : '') + '</tr>';
  };
  h.push(sum('小計', mitsuNum_(c.sub)));
  if (c.discount) h.push(sum('値引き', '-' + mitsuNum_(c.discount)));
  h.push(sum('<span style="font-size:9pt;">消費税(' + c.rate + '%)</span>', mitsuNum_(c.tax)));
  h.push(sum('合計（税込）', mitsuYen_(c.total), true));
  h.push('</table>');

  if (d.note || me['振込先']) {
    h.push('<table style="width:100%;margin-top:14px;">');
    if (d.note) h.push('<tr><td style="' + B + P + 'background:#e8eef5;font-weight:bold;width:18%;vertical-align:top;">備考</td>' + td(esc_(d.note).replace(/\n/g, '<br>')) + '</tr>');
    if (me['振込先']) h.push('<tr><td style="' + B + P + 'background:#e8eef5;font-weight:bold;width:18%;vertical-align:top;">お振込先</td>' + td(esc_(me['振込先']).replace(/\n/g, '<br>')) + '</tr>');
    h.push('</table>');
  }
  h.push('</body></html>');
  return h.join('');
}
function mitsuTemplateRows_(list, itemMap) {
  return list.map(function (t) {
    if (/^【/.test(t[0])) return [t[0], '', '', '', ''];
    var m = itemMap[t[0]] || {};
    return [t[0], t[1] || m.spec || '', t[3] === undefined || t[3] === null ? '' : t[3], t[2] || m.unit || '', m.price === undefined || m.price === null ? '' : m.price];
  });
}
var MI_LINES=40;
function startApp(D) {
var $ = function (id) { return document.getElementById(id); };
var lines = [];   // {name, spec, qty, unit, price}

function comma(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function num(v) { var t = String(v == null ? '' : v).replace(/,/g, '').trim(); if (t === '') return null; var n = Number(t); return isNaN(n) ? NaN : n; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function totals() {
  var sub = 0;
  lines.forEach(function (l) { var q = num(l.qty), p = num(l.price); if (q !== null && p !== null && !isNaN(q) && !isNaN(p)) sub += Math.round(q * p); });
  var disc = num($('discount').value); if (disc === null || isNaN(disc) || disc < 0) disc = 0;
  var tax = Math.floor((sub - disc) * 10 / 100 + 1e-9);
  $('sub').textContent = '小計 ' + comma(sub) + (disc ? ' ／ 値引き -' + comma(disc) : '') + ' ／ 消費税 ' + comma(tax);
  $('total').textContent = '¥' + comma(sub - disc + tax);
}

function amountText(l) {
  var q = num(l.qty), p = num(l.price);
  if (q === null && p === null) return l.name ? '<small>見出しとして出ます</small>' : '';
  if (q === null) return '<small>数量を入れてください</small>';
  if (p === null) return '<small>単価を入れてください</small>';
  if (isNaN(q) || isNaN(p)) return '<small>数字で入れてください</small>';
  return '金額 ' + comma(Math.round(q * p)) + ' 円';
}

function draw() {
  var box = $('lines'); box.innerHTML = '';
  lines.forEach(function (l, i) {
    var el = document.createElement('div'); el.className = 'card line';
    el.innerHTML = '<div class="top"><span class="no">' + (i + 1) + '</span><input data-k="name" list="items" placeholder="項目（選ぶか、そのまま入力）" autocomplete="off" value="' + esc(l.name) + '">' +
      '<button type="button" class="del">消す</button></div>' +
      '<label>仕様・内容</label><input data-k="spec" value="' + esc(l.spec) + '">' +
      '<div class="row"><div><label>数量</label><input data-k="qty" inputmode="decimal" value="' + esc(l.qty) + '"></div>' +
      '<div class="narrow"><label>単位</label><input data-k="unit" value="' + esc(l.unit) + '"></div>' +
      '<div><label>単価（円）</label><input data-k="price" inputmode="numeric" value="' + esc(l.price) + '"></div></div>' +
      '<div class="amt"></div>';
    var amt = el.querySelector('.amt'); amt.innerHTML = amountText(l);
    Array.prototype.forEach.call(el.querySelectorAll('input'), function (inp) {
      inp.addEventListener('input', function () {
        l[inp.dataset.k] = inp.value;
        if (inp.dataset.k === 'name') {
          var m = D.items[inp.value.trim()];
          if (m) {   // 項目を選んだら、空のところだけ 仕様・単位・単価 を入れる
            var set = function (k, v) { if (!String(l[k] || '').trim() && v !== '' && v != null) { l[k] = String(v); el.querySelector('[data-k="' + k + '"]').value = l[k]; } };
            set('spec', m.spec); set('unit', m.unit); set('price', m.price);
          }
        }
        amt.innerHTML = amountText(l); totals();
      });
    });
    el.querySelector('.del').addEventListener('click', function () { lines.splice(i, 1); if (!lines.length) addLine(); draw(); });
    box.appendChild(el);
  });
  totals();
}

function addLine(r) {
  r = r || ['', '', '', '', ''];
  lines.push({ name: String(r[0] || ''), spec: String(r[1] || ''), qty: r[2] === '' || r[2] == null ? '' : String(r[2]), unit: String(r[3] || ''), price: r[4] === '' || r[4] == null ? '' : String(r[4]) });
}

function reset() {
  ['to', 'title', 'place', 'discount', 'kouki', 'pay', 'note'].forEach(function (k) { $(k).value = ''; });
  $('keisho').value = '御中'; $('limit').value = D.limit; $('msg').textContent = '';
  lines = []; addLine(); draw();
  $('form').style.display = ''; $('bar').style.display = ''; $('done').style.display = 'none';
  $('make').disabled = false; $('make').textContent = '見積書をつくる（PDF）';
  window.scrollTo(0, 0);
}

$('custs').innerHTML = D.cust.map(function (c) { return '<option value="' + esc(c[0]) + '">'; }).join('');
$('items').innerHTML = Object.keys(D.items).map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
$('tpl').innerHTML = D.tplNames.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
if (!D.hasCompany) $('nocompany').style.display = '';

$('to').addEventListener('input', function () {
  var v = $('to').value.trim();
  D.cust.forEach(function (c) { if (c[0] === v && c[1]) $('keisho').value = c[1]; });
});
$('discount').addEventListener('input', totals);
$('add').addEventListener('click', function () { addLine(); draw(); });
$('tplBtn').addEventListener('click', function () {
  var rows = D.tpl[$('tpl').value] || [];
  lines = lines.filter(function (l) { return (l.name + l.spec + l.qty + l.unit + l.price).trim() !== ''; });
  if (lines.length + rows.length > D.lines) { $('msg').textContent = '明細は ' + D.lines + ' 行までです。'; return; }
  rows.forEach(function (r) { addLine(r); });
  draw();
});
$('again').addEventListener('click', reset);

$('make').addEventListener('click', function () {
  var rows = lines.filter(function (l) { return (l.name + l.spec + l.qty + l.unit + l.price).trim() !== ''; })
    .map(function (l) { return [l.name, l.spec, l.qty, l.unit, l.price]; });
  var p = { to: $('to').value, keisho: $('keisho').value, title: $('title').value, place: $('place').value, limit: $('limit').value,
    kouki: $('kouki').value, pay: $('pay').value, note: $('note').value, discount: $('discount').value, rows: rows };
