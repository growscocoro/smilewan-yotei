<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>設定</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 14px 60px; background: #f1f3f4; color: #202124; font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif; font-size: 16px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; color: #1a3a5f; margin: 4px 2px 6px; }
  h2 { font-size: 17px; color: #1a3a5f; margin: 24px 2px 6px; padding-left: 9px; border-left: 5px solid #1a3a5f; }
  .lead { font-size: 13px; color: #5f6368; margin: 0 2px 10px; line-height: 1.7; }
  .card { background: #fff; border: 1px solid #dadce0; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  label.f { display: block; font-size: 13px; color: #5f6368; margin: 10px 0 3px; } label.f:first-child { margin-top: 0; }
  input[type=text] { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #c0c4c9; border-radius: 8px; background: #fffde7; font-family: inherit; color: #202124; }
  input.num { text-align: right; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; min-width: 0; } .narrow { flex: 0 0 76px !important; } .mid { flex: 0 0 120px !important; }
  button { font-size: 16px; font-family: inherit; font-weight: bold; border-radius: 8px; padding: 11px 14px; border: 1px solid #1a3a5f; background: #fff; color: #1a3a5f; }
  button.main { background: #1a3a5f; color: #fff; width: 100%; font-size: 17px; padding: 13px; margin-top: 4px; }
  button.del { border-color: #c0c4c9; color: #c5221f; padding: 6px 10px; font-size: 13px; }
  button.mv { border-color: #c0c4c9; color: #5f6368; padding: 6px 10px; font-size: 13px; }
  button:disabled { opacity: .5; }
  .item .top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; } .item .no { font-weight: bold; color: #1a3a5f; } .item .sp { margin-left: auto; }
  .bgRow { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid #eceff1; } .bgRow:last-child { border-bottom: 0; }
  .bgRow .n { flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; word-break: break-all; } .bgRow .n small { display: block; color: #5f6368; font-size: 11px; }
  .bgRow .v { flex: 0 0 128px; display: flex; align-items: center; gap: 4px; font-size: 12px; color: #5f6368; } .bgRow .v input { padding: 8px; }
  .sub { font-size: 13px; font-weight: bold; color: #1a3a5f; background: #e8f0fe; border-radius: 4px; padding: 4px 8px; margin: 12px 0 2px; } .sub:first-child { margin-top: 0; }
  .msg { white-space: pre-wrap; font-size: 14px; line-height: 1.6; margin: 8px 2px 0; min-height: 1em; } .msg.ok { color: #188038; } .msg.ng { color: #c5221f; }
  .links { font-size: 14px; margin: 22px 2px; line-height: 2; } .links a { color: #1a73e8; }
  .dirty { font-size: 12px; color: #b06000; margin-left: 8px; font-weight: normal; }
</style>
</head>
<body>
<div class="wrap" id="gate">
  <h1>設定</h1>
  <div class="card">
    <label class="f">合言葉</label>
    <input type="text" id="gatePass" autocomplete="off" autocapitalize="off" style="-webkit-text-security:disc;">
    <button id="gateGo" class="main" type="button" style="margin-top:12px;">開く</button>
    <div id="gateMsg" class="msg ng"></div>
  </div>
</div>

<div class="wrap" id="form" style="display:none;">
  <h1>設定</h1>
  <p class="lead">見積書に載せる自社の情報、見積の項目と単価、積算の「手間の表」に使う単価を直します。直したら、それぞれの「保存する」を押してください。</p>

  <h2>自社の情報<span class="dirty" id="dMe"></span></h2>
  <p class="lead">見積書・内訳書に載ります。空の欄は載りません。</p>
  <div class="card"><div id="me"></div><button id="saveMe" class="main" type="button">自社の情報を保存する</button><div id="msgMe" class="msg"></div></div>

  <h2>見積の項目と単価<span class="dirty" id="dItems"></span></h2>
  <p class="lead">見積ページで項目を選ぶと、ここの仕様・単位・単価が入ります。単価は税抜きの金額です。空のままでも使えます。</p>
  <div id="items"></div>
  <button id="addItem" type="button" style="width:100%;margin-bottom:10px;">＋ 項目を足す</button>
  <button id="saveItems" class="main" type="button">見積の項目を保存する</button><div id="msgItems" class="msg"></div>

  <h2>手間の表の単価<span class="dirty" id="dBg"></span></h2>
  <p class="lead">積算ページの「手間の表から単価を作る」に使います。材料の値段は、1kg（研磨紙は1枚）あたり・税抜きです。空の材料は0円で計算されます。</p>
  <div class="card"><div id="bg"></div><button id="saveBg" class="main" type="button">手間の表の単価を保存する</button><div id="msgBg" class="msg"></div></div>

  <div class="links"><a href="./">積算のページへ</a><br><a href="mitsumori.html">見積書をつくるページへ</a><br><a href="rireki.html">つくった見積書・内訳書を見る</a><br><a id="gateOut" href="#">合言葉を入れ直す</a></div>
</div>

<script>
var SUPA_URL = "https://uniutujwbmwijizjdoyp.supabase.co", SUPA_KEY = "sb_publishable_T8oC_65bBzsHNoj1dBHP-Q_3wkv-zoi", PASSKEY = 'sekisan-pass-v1', PASSBOX = sessionStorage, apiPass = '';
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
function rpc(fn, args) {
  var body = { p_pass: apiPass }; for (var k in (args || {})) body[k] = args[k];
  return fetch(SUPA_URL.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY }, body: JSON.stringify(body) })
    .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, status: r.status, text: t }; }); }, function () { throw new Error('つながりませんでした。電波を確かめて、もう一度ためしてください。'); })
    .then(function (x) {
      var j = null; try { j = x.text === '' ? null : JSON.parse(x.text); } catch (e) { j = null; }
      if (x.ok && j && j.qb_error) {
        var e1 = new Error(j.qb_error === 'badpass' ? '合言葉がちがいます。' : j.qb_error === 'locked' ? '合言葉を何度もまちがえたので、しばらく開けません。15分ほど待ってから、もう一度ためしてください。' : '合言葉がまだ決まっていません。');
        e1.badPass = j.qb_error === 'badpass'; throw e1;
      }
      if (x.ok) return j;
      throw new Error(j && j.message ? j.message : '保存先につながりませんでした（' + x.status + '）。');
    });
}

var me = [], items = [], bg = [], dirty = { me: false, items: false, bg: false };
function mark(k, v) { dirty[k] = v; $({ me: 'dMe', items: 'dItems', bg: 'dBg' }[k]).textContent = v ? '（まだ保存していません）' : ''; }
function say(id, text, ok) { $(id).textContent = text || ''; $(id).className = 'msg ' + (ok ? 'ok' : 'ng'); }

function drawMe() {
  $('me').innerHTML = me.map(function (m, i) { return '<label class="f">' + esc(m[0]) + '</label><input type="text" data-me="' + i + '" value="' + esc(m[1]) + '">'; }).join('');
}
function drawItems() {
  $('items').innerHTML = items.map(function (it, i) {
    return '<div class="card item" data-i="' + i + '"><div class="top"><span class="no">' + (i + 1) + '</span><span class="sp"></span>' +
      '<button class="mv" type="button" data-a="up"' + (i === 0 ? ' disabled' : '') + '>上へ</button><button class="mv" type="button" data-a="down"' + (i === items.length - 1 ? ' disabled' : '') + '>下へ</button><button class="del" type="button" data-a="del">消す</button></div>' +
      '<label class="f">項目</label><input type="text" data-k="0" value="' + esc(it[0]) + '">' +
      '<label class="f">仕様・内容</label><input type="text" data-k="1" value="' + esc(it[1]) + '">' +
      '<div class="row"><div class="narrow"><label class="f">単位</label><input type="text" data-k="2" value="' + esc(it[2]) + '"></div>' +
      '<div><label class="f">単価（円・税抜）</label><input type="text" class="num" inputmode="numeric" data-k="3" value="' + esc(it[3]) + '" placeholder="空でもよい"></div></div></div>';
  }).join('');
}
function drawBg() {
  var last = '', label = { '労務': '労務単価（1日あたり・円）', '率': '諸経費の率（％）', '材料': '材料の値段（円）' };
  $('bg').innerHTML = bg.map(function (b, i) {
    var head = b[0] !== last ? '<div class="sub">' + esc(label[b[0]] || b[0]) + '</div>' : ''; last = b[0];
    return head + '<div class="bgRow"><span class="n">' + esc(b[1]) + (b[0] !== '材料' && b[4] ? '<small>' + esc(b[4]) + '</small>' : '') + '</span>' +
      '<span class="v"><input type="text" class="num" inputmode="decimal" data-bg="' + i + '" value="' + esc(b[3]) + '"' + (b[0] === '材料' ? ' placeholder="空"' : '') + '>' + esc(b[0] === '率' ? '％' : '円／' + b[2]) + '</span></div>';
  }).join('');
}
function fill(d) {
  me = (d.me || []).map(function (m) { return [m[0], m[1] || '']; });
  items = (d.items || []).map(function (r) { return [r[0], r[1] || '', r[2] || '', r[3] === null || r[3] === undefined ? '' : String(r[3]), r[4] || '']; });
  bg = (d.bg || []).map(function (b) { return [b[0], b[1], b[2] || '', b[3] === null || b[3] === undefined ? '' : String(b[3]), b[4] || '']; });
  drawMe(); drawItems(); drawBg(); mark('me', false); mark('items', false); mark('bg', false);
}

$('me').addEventListener('input', function (e) { var i = e.target.getAttribute('data-me'); if (i === null) return; me[Number(i)][1] = e.target.value; mark('me', true); say('msgMe', ''); });
$('items').addEventListener('input', function (e) { var k = e.target.getAttribute('data-k'), c = e.target.closest('.item'); if (k === null || !c) return; items[Number(c.getAttribute('data-i'))][Number(k)] = e.target.value; mark('items', true); say('msgItems', ''); });
$('items').addEventListener('click', function (e) {
  var a = e.target.getAttribute('data-a'), c = e.target.closest('.item'); if (!a || !c) return;
  var i = Number(c.getAttribute('data-i')), t;
  if (a === 'del') { if (items[i][0] && !confirm('「' + items[i][0] + '」を消しますか？（保存するまでは、元に戻せます）')) return; items.splice(i, 1); }
  else if (a === 'up' && i > 0) { t = items[i - 1]; items[i - 1] = items[i]; items[i] = t; }
  else if (a === 'down' && i < items.length - 1) { t = items[i + 1]; items[i + 1] = items[i]; items[i] = t; }
  drawItems(); mark('items', true); say('msgItems', '');
});
$('addItem').addEventListener('click', function () { items.push(['', '', '', '', '']); drawItems(); mark('items', true); var c = document.querySelectorAll('.item'); c[c.length - 1].scrollIntoView({ block: 'center' }); c[c.length - 1].querySelector('input').focus(); });
$('bg').addEventListener('input', function (e) { var i = e.target.getAttribute('data-bg'); if (i === null) return; bg[Number(i)][3] = e.target.value; mark('bg', true); say('msgBg', ''); });

function save(btn, msg, key, fn, arg, check) {
  var bad = check ? check() : '';
  if (bad) { say(msg, bad, false); return; }
  $(btn).disabled = true; say(msg, '保存しています…', true);
  rpc(fn, { p: arg() }).then(function () { return rpc('qb_s_load'); }).then(function (d) {
    // 保存したものだけ、保存先の今の中身に合わせ直す（ほかの欄の書きかけは消さない）
    if (key === 'me') { me = (d.me || []).map(function (m) { return [m[0], m[1] || '']; }); drawMe(); }
    if (key === 'items') { items = (d.items || []).map(function (r) { return [r[0], r[1] || '', r[2] || '', r[3] === null ? '' : String(r[3]), r[4] || '']; }); drawItems(); }
    if (key === 'bg') { bg = (d.bg || []).map(function (b) { return [b[0], b[1], b[2] || '', b[3] === null ? '' : String(b[3]), b[4] || '']; }); drawBg(); }
    mark(key, false); $(btn).disabled = false; say(msg, '保存しました。', true);
  }).catch(function (e) { $(btn).disabled = false; say(msg, '保存できませんでした。\n' + String(e.message || e), false); });
}
var numOk = function (v) { return /^[0-9]{1,9}(\.[0-9]+)?$/.test(String(v).replace(/[,，\s]/g, '')); };
var z2h = function (v) { v = String(v); return (v.normalize ? v.normalize('NFKC') : v).replace(/[,\s]/g, ''); };
$('saveMe').addEventListener('click', function () { save('saveMe', 'msgMe', 'me', 'qb_s_save_me', function () { var o = {}; me.forEach(function (m) { o[m[0]] = m[1]; }); return o; }); });
$('saveItems').addEventListener('click', function () {
  save('saveItems', 'msgItems', 'items', 'qb_s_save_items', function () { return items.filter(function (r) { return String(r[0]).trim(); }).map(function (r) { return [r[0], r[1], r[2], z2h(r[3]), r[4]]; }); }, function () {
    var seen = {}, rows = items.filter(function (r) { return String(r[0]).trim(); }), i, n;
    if (!rows.length) return '項目が1つもありません。全部消すことはできません。';
    for (i = 0; i < items.length; i++) {
      n = String(items[i][0]).trim();
      if (!n) { if ((items[i][1] + items[i][2] + items[i][3]).trim()) return (i + 1) + '番目：項目の名前が空です。'; continue; }
      if (seen[n]) return '「' + n + '」が2つあります。1つにまとめてください。';
      seen[n] = true;
      if (z2h(items[i][3]) !== '' && !numOk(z2h(items[i][3]))) return '「' + n + '」の単価は数字で入れてください。';
    }
    return '';
  });
});
$('saveBg').addEventListener('click', function () {
  save('saveBg', 'msgBg', 'bg', 'qb_s_save_bg', function () { var o = {}; bg.forEach(function (b) { o[b[1]] = z2h(b[3]); }); return o; }, function () {
    for (var i = 0; i < bg.length; i++) {
      var v = z2h(bg[i][3]);
      if (v === '') { if (bg[i][0] !== '材料') return '「' + bg[i][1] + '」は空にできません。'; continue; }
      if (!numOk(v)) return '「' + bg[i][1] + '」は数字で入れてください。';
      if (bg[i][0] === '率' && Number(v) > 100) return '「' + bg[i][1] + '」は100までの数字にしてください。';
    }
    return '';
  });
});
window.addEventListener('beforeunload', function (e) { if (dirty.me || dirty.items || dirty.bg) { e.preventDefault(); e.returnValue = ''; } });
$('gateOut').addEventListener('click', function (e) { e.preventDefault(); try { PASSBOX.removeItem(PASSKEY); } catch (err) {} dirty = { me: false, items: false, bg: false }; location.reload(); });

(function () {
  var started = false, turn = 0;
  function openGate(pass, quiet) {
    var mine = ++turn;
    apiPass = pass; $('gateGo').disabled = true; $('gateMsg').className = 'msg ok'; $('gateMsg').style.color = '#5f6368'; $('gateMsg').textContent = '開いています…';
    rpc('qb_s_load').then(function (d) {
      if (started) return; started = true;
      try { PASSBOX.setItem(PASSKEY, pass); } catch (e) {}
      $('gate').style.display = 'none'; $('form').style.display = 'block';
      fill(d);
    }).catch(function (e) {
      if (started || mine !== turn) return;
      $('gateGo').disabled = false; $('gateMsg').style.color = '#c5221f';
      if (e.badPass) { try { PASSBOX.removeItem(PASSKEY); } catch (err) {} }
      $('gateMsg').textContent = quiet && e.badPass ? '合言葉を入れてください。' : String(e.message || e);
    });
  }
  $('gateGo').addEventListener('click', function () { var p = $('gatePass').value.trim(); if (!p) { $('gateMsg').textContent = '合言葉を入れてください。'; return; } openGate(p, false); });
  $('gatePass').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('gateGo').click(); });
  var saved = ''; try { saved = PASSBOX.getItem(PASSKEY) || ''; } catch (e) {}
  if (saved) openGate(saved, true);
})();
</script>
</body>
</html>
