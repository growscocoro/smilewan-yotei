<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>精神訪問看護 記録文作成ツール</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--line:#d9d4c7;--ink:#222;--sub:#6b6658;--acc:#e08a00;--accbg:#fff3dc;--ok:#1f7a4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:16px;line-height:1.6}
header{background:var(--acc);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1 0 auto}
header small{opacity:.95;flex:1 1 260px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px;max-width:1400px;margin:0 auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px;border-left:5px solid var(--acc);padding-left:8px}
.card.slim{padding:8px 12px;margin-bottom:8px}
.ttl{font-weight:bold;border-left:5px solid var(--acc);padding-left:8px}
.pick{color:#7a4a00;background:var(--accbg);border-radius:6px;padding:1px 8px;margin-left:10px;font-weight:normal;font-size:14px}
details.slim>summary{list-style:none;padding:8px 0;font-size:16px}
.nextrow{justify-content:space-between;align-items:center;margin-top:14px}
.nextrow .cnt{color:var(--sub);font-size:14px}
/* 1つずつ選ぶ画面：出すのは今の1項目だけ */
body.wiz #form details.slim:not([open]),body.wiz #form .more,body.wiz .out{display:none}
body.wiz #form details.slim>summary{pointer-events:none;font-size:20px}
body.wiz #form details.slim{margin-bottom:12px}
.prevbox{margin-top:16px;padding:8px 12px}
.prevbox>summary{font-weight:normal;color:var(--sub);font-size:14px}
#left{margin:6px 0}
body.wiz #form details.slim>summary::after{content:none}
body.wiz .wrap{display:block;max-width:720px;margin:0 auto}
body.wiz.kz #form,body.wiz.fin #form{display:none}
body.wiz.kz .out,body.wiz.fin .out{display:block}
body.wiz.kz .out>*:not(#kpanel){display:none}
body.wiz.fin #kpanel{display:none!important}
body:not(.wiz):not(.ken) .wizonly{display:none}
/* 検索して追加する画面 */
#ken{display:none}
body.ken #ken{display:block}
body.ken #form,body.ken .out,body.ken.fin #ken{display:none}
body.ken.fin .out{display:block}
body.ken.fin #kpanel{display:none!important}
body.ken .wrap{display:block;max-width:760px;margin:0 auto}
#ken .chip small{opacity:.7;font-size:12px}
#ken .lab{min-width:3em}
body:not(.wiz) .nextrow .back,body:not(.wiz) .nextrow .cnt{display:none}
body:not(.wiz) .nextrow{justify-content:flex-end}
.nextrow .btn{font-size:15px;padding:8px 18px}
details.slim>summary::-webkit-details-marker{display:none}
details.slim>summary::after{content:'＋';float:right;color:var(--sub)}
details.slim[open]>summary::after{content:'－'}
summary{font-weight:bold;cursor:pointer}
.dot{color:var(--acc);font-size:13px;margin-left:6px}
.warn{background:#fde8e6;border:1px solid #d33;color:#a00000;padding:8px 10px;border-radius:6px;font-weight:bold;margin-top:6px}
.sv{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.sub{margin:6px 0 6px 14px}
.sub>summary{font-weight:normal;font-size:14px;color:var(--sub);padding:4px 0}
.more{margin-top:16px}
.more>summary{padding:8px 4px;color:var(--sub)}
.more[open]>summary{margin-bottom:8px}
.sec{font-size:14px;font-weight:bold;color:var(--sub);margin:18px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.row .lab{font-size:13px;color:var(--sub);min-width:4.5em;width:100%}
.ind{margin-left:14px;padding-left:10px;border-left:2px dotted var(--line)}
.chip{font:inherit;font-size:16px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:bold}
.chip.sm{font-size:15px;padding:7px 13px}
.chip.sm.on{background:var(--accbg);color:#7a4a00;border-color:var(--acc)}
input[type=text],textarea{font:inherit;font-size:15px;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=text]{max-width:420px}
textarea{min-height:170px;resize:vertical}
.out{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:900px){.out{position:static;max-height:none}}
.btn{font:inherit;font-size:14px;padding:6px 14px;border:1px solid var(--acc);border-radius:6px;background:#fff;color:#7a4a00;cursor:pointer;white-space:nowrap}
.btn.main{background:var(--acc);color:#fff;font-weight:bold}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
td:first-child{white-space:nowrap;color:var(--sub);width:1%}
td:last-child{width:1%}
.note{font-size:13px;color:var(--sub)}
.empty{color:var(--sub);font-size:14px}
</style>
</head>
<body>
<header>
  <h1>精神訪問看護 記録文作成ツール</h1>
  <small id="hint">言葉を探して追加し、「文章を作成する」。</small>
  <button class="btn" id="mode">順に選ぶ</button>
  <button class="btn" id="reset">全部消す</button>
</header>
<div class="wrap">
  <div id="ken"></div>
  <div id="form"></div>
  <div class="out">
    <div class="card" id="kpanel" style="display:none"></div>
    <div class="card">
      <div class="head"><h2>全身状態フリー記入 に貼る文章</h2><button class="btn main" data-copy="zenshin">コピー</button></div>
      <div class="row"><button class="btn wizonly" id="backsel">◀ 選び直す</button><button class="btn main" id="make" style="font-size:16px;padding:10px 20px">文章を作成する</button></div>
      <div class="note" id="mknote"></div>
      <textarea id="zenshin" placeholder="左で選び終わったら「文章を作成する」を押すと、ここに文章が出ます。"></textarea>
      <div id="left"></div>
      <details class="note"><summary>文章の設定</summary>
        <label><input type="checkbox" id="nashi"> 押していない項目は「課題なし」と書く</label><br>
        <label><input type="checkbox" id="midashi"> 【問題点】【改善案】【実施したこと】の見出しを付ける</label><br>
        <label><input type="checkbox" id="atama" checked> 年代の特徴を文に入れる（「20代」などの数字は入れません）</label><br>
        <label><input type="checkbox" id="kfirst"> 改善案を文の最初に書く</label><br>
        <label><input type="checkbox" id="nagai"> 選んだ言葉を全部入れた長い文章にする（400字くらい）</label>
      </details>
      <div class="row"><input type="text" id="tag" placeholder="目印（なくてもよい・番号など。氏名は入れない）" style="max-width:300px"><button class="btn main" id="save">保存する</button></div>
      <div id="warn"></div>
    </div>
    <div class="card" id="renkeiCard" style="display:none">
      <div class="head"><h2>連携 に貼る文章</h2><button class="btn main" data-copy="renkei">コピー</button></div>
      <textarea id="renkei" style="min-height:70px"></textarea>
    </div>
    <details class="card">
      <summary>保存した文章（<span id="cnt">0</span>件）</summary>
      <div id="saved"></div>
    </details>
    <details class="card">
      <summary>各欄に入れる内容（チェックと かっこの中）</summary>
      <div id="rows"></div>
    </details>
  </div>
</div>

function ren(s){ // 文の途中の形（〜しており、〜で、）
  s=s.replace(/。$/,'');
  const m=s.match(/^(.*)あり（(.+)）$/);
  if(m)return m[1]+'が'+m[2]+pv('r'+s,BANK.回数途中);
  const R=[[/にいる$/,'におり'],[/てみる$/,'てみて'],[/ていない$/,'ておらず'],[/ている$/,'ており'],[/でいる$/,'でおり'],[/である$/,'であり'],[/([えけせてねめれげべき])ない$/,'$1ず'],[/ない$/,'なく'],[/なし$/,'はなく'],[/あり$/,pv('r'+s,BANK.あり途中)],
    [/(多|遅|狭|長|強|暗|硬|明る|大き|乏し)い$/,'$1く'],[/する$/,'し'],[/(測|と|つく|かか|な|取|作|返|あ)る$/,'$1り'],[/る$/,''],[/す$/,'し'],[/う$/,'い'],[/く$/,'き'],[/ぶ$/,'び'],[/む$/,'み'],[/つ$/,'ち']];
  for(const [a,b] of R)if(a.test(s))return s.replace(a,b);
  return s+(SURU.test(s)?'し':'で');
}
function fin(s){ // 文の終わりの形
  s=s.replace(/。$/,'');
  const m=s.match(/^(.*)あり（(.+)）$/);
  if(m)return m[1]+'が'+m[2]+pv('f'+s,BANK.回数文末);
  if(/あり$/.test(s))return s.replace(/あり$/,pv('f'+s,BANK.あり文末));
  if(/なし$/.test(s))return s.replace(/なし$/,'はない');
  if(/[るすうくぶむつただ]$/.test(s)||(/い$/.test(s)&&!/あいまい$/.test(s)))return s;
  return s+(SURU.test(s)?'している':'である');
}
function chain(cl,open){ // 言い切りの形の並び → つなげた1文（open＝最後も途中の形）
  const isA=c=>/あり$/.test(c),ari=cl.filter(isA),i=cl.findIndex(isA);
  if(ari.length>1){cl=cl.filter(c=>!isA(c));cl.splice(i,0,ari.map(c=>c.replace(/あり$/,'')).join('や')+'あり');}
  const o=cl.map((c,j)=>j<cl.length-1||open?ren(c):fin(c));
  for(let j=0;j<o.length-1;j++)for(const w of ['がみられ','を認め','が確認され','が観察され'])if(o[j].endsWith(w)&&(o[j+1].endsWith(w)||o[j+1].endsWith(w+'る')))o[j]=o[j].slice(0,-w.length)+'があり'; // 同じ言い方が続かないように
  return o.join('、');
}

function sim(a,b){
  const bg=t=>{t=t.replace(/\s/g,'');const m=new Map();for(let i=0;i<t.length-1;i++){const k=t.slice(i,i+2);m.set(k,(m.get(k)||0)+1);}return m;};
  const A=bg(a),B=bg(b);let x=0,na=0,nb=0;
  for(const v of A.values())na+=v;for(const v of B.values())nb+=v;
  for(const [k,v] of A)x+=Math.min(v,B.get(k)||0);
  return na+nb?2*x/(na+nb):0;
}

    const gl=main=>br?Object.entries(GAISHUTSU[br]).filter(([g])=>MAING.includes(g)===main).map(([g,o])=>line(GLAB[g],chips('活動|外出|'+br+'|'+g,o,1))).join(''):'';
    const auxSel=[...S].some(x=>/^活動\|外出\|(あり|なし)\|(同伴|手段|様子|用事|気持ち)\|/.test(x)||x.startsWith('活動|過ごし方|'));
    const sub=`<details class="sub" data-d="gai-sub"${OPEN.has('gai-sub')?' open':''}><summary>その他（${br==='あり'?'だれと・行き方・外出時の様子・':br==='なし'?'買い物や通院・本人の気持ち・':''}過ごし方）${auxSel?'<span class="pick">入力あり</span>':''}</summary>${gl(false)+line('過ごし方',chips('活動|過ごし方',lim('活動|過ごし方',KATSUDO.過ごし方,4),1))}</details>`;
    h+=slim('外出・過ごし方',chip('活動|外出|あり','外出あり')+chip('活動|外出|なし','外出なし'),gl(true)+sub,'活動|');
  }
  h+=slim('表情・言動',chips('精神|表情',SEISHIN.表情),line('言動',chips('精神|言動',SEISHIN.言動,1)),'精神|');

  const list=(base,arr)=>`<div class="row">${arr.map(([n])=>chip(base+'|'+n,n)).join('')}</div>`
    +arr.filter(([n,o])=>S.has(base+'|'+n)&&o.length).map(([n,o])=>line(n+'の内容',chips(base+'|'+n,o,1))).join('');
  h+=fold('care','care|','実施した看護内容',list('care',CARE));

  h+=fold('身体','身体|','身体の状態（血圧・体調）',Object.entries(SHINTAI).map(([g,o])=>line(g,chips('身体|'+g,g==='訴え'||g==='対応'?lim('身体|'+g,o,6):o,1))).join('')
    +`<div class="row">${inp('身体','そのほかの状態（自由に書く）')}</div><div class="row">${inp('身体|経過','そのほかの経過（自由に書く）')}</div>`);
  h+=fold('shido','shido|','指導・教育',list('shido',SHIDO));
  h+=fold('renkei','renkei|','連携（医師・ケアマネジャーなど）',line('相手',chips('renkei|相手',RENKEI.相手,1))+line('内容',chips('renkei|内容',RENKEI.内容,1))+`<div class="row">${inp('renkei')}</div>`);
  h+=fold('memo','memo','そのほか実施したこと（自由に書く）',`<div class="row">${inp('memo','例：バイタルサインを測定した。')}</div>`);
  top.sort((a,b)=>HISSU.indexOf(a[0])-HISSU.indexOf(b[0]));
  const tj=a=>a.map(x=>x[1]).join('');
  const n=rest.filter(x=>x[1].includes('class="pick"')).length;
  document.getElementById('form').innerHTML=tj(top)+`<details class="more" data-d="more"${OPEN.has('more')?' open':''}><summary>そのほかの項目（必要なときだけ開く）${n?`<span class="pick">${n}項目に入力あり</span>`:''}</summary>${tj(rest)}</details>`;
  ORDER=top.concat(rest).map(x=>x[2]);TOPN=top.length;
  for(const k of [ORDER[TOPN-1],ORDER[ORDER.length-1]]){const nb=document.querySelector('[data-next="'+CSS.escape(k)+'"]');if(nb)nb.textContent='選び終わり ▶ 文章を作成する';}
  if(WIZ)document.querySelectorAll('#form details.slim').forEach(d=>{const k=d.dataset.d,i=stepOf(k),row=d.querySelector(':scope > .nextrow');if(i<0||!row)return;if(STEPS[i][STEPS[i].length-1]!==k){row.style.display='none';return;}row.querySelector('.cnt').textContent=(i+1)+' / '+STEPS.length;if(i===0)row.querySelector('.back').style.visibility='hidden';});
  if(WIZ&&PHASE==='step'&&OPEN.has(STEPS[0][0])){ // 最初の画面だけ：前に保存した内容から始められる
    const sv=load().map((r,i)=>[r,i]).filter(x=>x[0].sel).reverse().slice(0,8);
    if(sv.length)document.getElementById('form').insertAdjacentHTML('beforeend','<details class="card prevbox"><summary>前回の内容から始める（'+sv.length+'件）</summary>'+sv.map(([r,i])=>`<div class="row"><button class="btn" data-load="${i}">${esc((r.tag||'目印なし')+'　'+hi(r.t))}</button><span class="note">${esc(r.zenshin.slice(0,28))}…</span></div>`).join('')+'</details>');
  }
  const dr=document.getElementById('dres');if(dr)dr.innerHTML=resHtml();
  const kp=document.getElementById('kpanel'),act=kactive();
  kp.style.display=act.length?'':'none';
  kp.innerHTML='<h2>改善案（選んだ内容に合う案から選ぶ）</h2>'+act.map(K=>{
    const sel=kpicked(K),cand=suggest(K).filter(x=>!sel.includes(x));
    const off=cand.length?((KOFF[K]||0)*3)%cand.length:0,show=cand.slice(off,off+3);
    return `<div class="row"><span class="lab">${esc(KLAB[K]||K)}</span>${chips('kaizen|'+K,sel.concat(show),1)}${cand.length>3?`<button class="btn" data-kmore="${esc(K)}">別の案</button>`:''}</div>`;}).join('')+'<div class="row nextrow wizonly"><button class="btn" id="kzback">◀ 戻る</button><span class="cnt">改善案</span><button class="btn main" id="kznext">次へ ▶</button></div>';
}
function resHtml(){
  const q=Q.trim().replace(/\|/g,'');
  if(!q)return '<span class="note">文字を入れると候補が出ます。ひらがなでも探せます。</span>';
  const k=q.toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  const hit=DLIST.filter(([n,y])=>!S.has('shikkan|'+n)&&(n.toLowerCase().includes(q.toLowerCase())||(y||'').includes(k))).slice(0,20);
  const exact=DLIST.some(([n])=>n===q)||SHIKKAN.includes(q)||S.has('shikkan|'+q);
  return hit.map(([n])=>chip('shikkan|'+n,n,1)).join('')+(exact?'':chip('shikkan|'+q,'「'+q+'」をそのまま追加',1))+(hit.length?'':'<span class="note">候補にありません。そのまま追加できます。</span>');
}
// 文章は、選ぶたびには作らない。選び終わってから「文章を作成する」で、選んだ内容をまとめて作る
const MADE={key:null,left:[]};
const selKey=()=>JSON.stringify([[...S].sort(),Object.keys(T).sort().map(k=>[k,txt(k)]).filter(x=>x[1]),HEAD,ATAMA,KFIRST,LONG]);
function out(){
  const g=gen();
  document.getElementById('rows').innerHTML=g.rows.length
    ?'<table>'+g.rows.map(([a,b],i)=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td><td><button class="btn" data-row="${i}">コピー</button></td></tr>`).join('')+'</table>'
    :'<div class="empty">左で選ぶと、ここに出ます。</div>';
  out.rows=g.rows;
  const z=document.getElementById('zenshin').value.trim();
  document.getElementById('mknote').textContent=MADE.key===null||!z?'':MADE.key!==selKey()?'選んだ内容が変わりました。もう一度「文章を作成する」を押すと、作り直します。':'もう一度押すと、別の言い方で作り直します。';
  if(z)document.getElementById('mknote').textContent+='（'+z.length+'字）';
}
function make(){
  const key=selKey(),cur=document.getElementById('zenshin').value;
  if(!gen().zenshin){document.getElementById('mknote').textContent='まだ何も選ばれていません。左で選んでから押してください。';return;}
  let g=null;
  for(let t=0;t<20&&(!g||g.zenshin===cur);t++){
    SEED+=101;g=gen();
    const a=load();
    if(a.length){let best=1e9;for(let i=0;i<6;i++){const c=gen(SEED+i);if(c.zenshin===cur)continue;const v=Math.max(...a.map(r=>sim(c.zenshin,r.zenshin)));if(v<best-1e-9){best=v;g=c;}}}
  }
  document.getElementById('zenshin').value=g.zenshin;
  document.getElementById('renkei').value=g.renkei;
  document.getElementById('renkeiCard').style.display=g.renkei?'':'none';
  MADE.key=key;MADE.left=g.left;renderLeft();out();check();
}
// 文章に入らなかったもの（押すと文章の最後に足す）
function renderLeft(){
  const a=MADE.left||[];
  document.getElementById('left').innerHTML=a.length?'<div class="note">文章に入っていないもの（押すと文章の最後に足します）</div><div class="row">'+a.map((x,i)=>`<button type="button" class="chip sm" data-add="${i}">＋ ${esc(x[0])}</button>`).join('')+'</div>':'';
}
// ===== 保存（このパソコンのブラウザの中） =====
const SKEY='kangoKirokuBun.saved';
function load(){try{return JSON.parse(localStorage.getItem(SKEY)||'[]');}catch(e){return [];}}
function store(a){try{localStorage.setItem(SKEY,JSON.stringify(a));return true;}catch(e){alert('保存できませんでした。ブラウザの設定で保存が止められている可能性があります。');return false;}}
const hi=t=>{const d=new Date(t);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;};
let lastSaved='';
function nearest(text){
  let best=null;
  for(const r of load()){const v=sim(text,r.zenshin);if(!best||v>best.v)best={v,r};}
  return best;
}
function check(){
  const cur=document.getElementById('zenshin').value.trim(),w=document.getElementById('warn');
  const b=cur.length>=10&&cur!==lastSaved?nearest(cur):null;
  w.innerHTML=b&&b.v>=KEISHO?`<div class="warn">⚠ 以前の文章と ${Math.round(b.v*100)}% 同じです（${esc(hi(b.r.t))} 保存${b.r.tag?'・目印：'+esc(b.r.tag):''}）。内容を見直してください。</div>`:'';
}
function renderSaved(){
  const a=load();
  document.getElementById('cnt').textContent=a.length;
  document.getElementById('saved').innerHTML=a.length
    ?a.map((r,i)=>[r,i]).reverse().map(([r,i])=>`<div class="sv"><div class="note">${esc(hi(r.t))}${r.tag?'　目印：'+esc(r.tag):''}</div><div>${esc(r.zenshin)}</div>${r.renkei?`<div class="note">連携：${esc(r.renkei)}</div>`:''}<div class="row">${r.sel?`<button class="btn" data-load="${i}">この内容から始める</button>`:''}<button class="btn" data-cp="${i}">コピー</button><button class="btn" data-del="${i}">削除</button></div></div>`).join('')+'<div class="row"><button class="btn" id="delall">保存した文章を全部削除</button></div>'
    :'<div class="empty">まだ保存していません。</div>';
}
// 保存した時の選んだ内容を呼び出す（文章は作り直す）
function loadSel(r){
  if(!r||!r.sel)return;
  S.clear();for(const k of Object.keys(T))delete T[k];
  r.sel.forEach(x=>S.add(x));Object.assign(T,r.txts||{});
  document.getElementById('nashi').checked=S.has('nashiAll');document.getElementById('tag').value=r.tag||'';
  applyAge();MADE.key=null;MADE.left=[];renderLeft();
  document.getElementById('zenshin').value='';document.getElementById('renkei').value='';document.getElementById('renkeiCard').style.display='none';
  if(WIZ||KEN)showStep(0);else{render();out();}check();
}
function saveNow(){
  const z=document.getElementById('zenshin').value.trim();
  if(!z){alert('文章がまだありません。');return;}
  const b=nearest(z);
  if(b&&b.v>=KEISHO&&!confirm(`以前の文章と ${Math.round(b.v*100)}% 同じです（${hi(b.r.t)} 保存）。\nこのまま保存しますか？`))return;
  const a=load();
  a.push({t:Date.now(),tag:document.getElementById('tag').value.trim(),zenshin:z,renkei:document.getElementById('renkei').value.trim(),sel:[...S],txts:Object.fromEntries(Object.keys(T).filter(k=>txt(k)).map(k=>[k,T[k]]))});
  if(!store(a))return;
  lastSaved=z;renderSaved();render();check();
  const s=document.getElementById('save');s.textContent='保存しました';s.classList.add('done');
  setTimeout(()=>{s.textContent='保存する';s.classList.remove('done');},1200);
}
async function copy(text,btn){
  try{await navigator.clipboard.writeText(text);}
  catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
  const old=btn.textContent;btn.textContent='コピーしました';btn.classList.add('done');
  setTimeout(()=>{btn.textContent=old;btn.classList.remove('done');},1200);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.id!==undefined){if(b.closest('#dres'))Q='';toggle(b.dataset.id);if(KEN)kPrune(kIndex());render();out();if(!KEN&&b.dataset.id.startsWith('nenrei|')&&S.has(b.dataset.id))goNext('年齢');}
  else if(b.dataset.next!==undefined)goNext(b.dataset.next);
  else if(b.dataset.add!==undefined){const z=document.getElementById('zenshin'),x=MADE.left.splice(b.dataset.add,1)[0];if(x){z.value=z.value.replace(/\s+$/,'')+x[1];renderLeft();out();check();}}
  else if(b.dataset.load!==undefined)loadSel(load()[b.dataset.load]);
  else if(b.dataset.back!==undefined)goBack(b.dataset.back);
  else if(b.id==='kznext')showStep(STEPS.length-1);
  else if(b.id==='kzback')showStep(STEPS.length-2);
  else if(b.id==='backsel')showStep(0);
  else if(b.id==='mode'){KEN=!KEN;WIZ=true;b.textContent=KEN?'順に選ぶ':'検索で選ぶ';document.getElementById('hint').textContent=KEN?'言葉を探して追加し、「文章を作成する」。':'あてはまるものを選んで「次へ」。';showStep(0);}
  else if(b.dataset.kadd!==undefined){const id=b.dataset.kadd;if(!S.has(id)){toggle(id);freqAdd(id);}KQ='';const i=document.getElementById('kq');i.value='';render();out();i.focus();}
  else if(b.dataset.krem!==undefined){if(S.has(b.dataset.krem))toggle(b.dataset.krem);kPrune(kIndex());render();out();}
  else if(b.dataset.kfree!==undefined){const w=KQ.trim().replace(/\n/g,' ');if(w){T.jiyu=jiyu().concat([w]).join('\n');}KQ='';const i=document.getElementById('kq');i.value='';render();out();i.focus();}
  else if(b.dataset.kfreerem!==undefined){const a=jiyu();a.splice(b.dataset.kfreerem,1);T.jiyu=a.join('\n');render();out();}
  else if(b.id==='kmake'){if(!gen().zenshin){document.getElementById('knote').textContent='まだ何も選ばれていません。';return;}document.getElementById('knote').textContent='';finish();}
  else if(b.dataset.copy)copy(document.getElementById(b.dataset.copy).value,b);
  else if(b.dataset.row!==undefined)copy(out.rows[b.dataset.row][1].replace(/^(✓|課題あり|課題なし)　?/,'')||out.rows[b.dataset.row][1],b);
  else if(b.dataset.kmore!==undefined){KOFF[b.dataset.kmore]=(KOFF[b.dataset.kmore]||0)+1;render();}
  else if(b.id==='save')saveNow();
  else if(b.dataset.cp!==undefined)copy(load()[b.dataset.cp].zenshin,b);
  else if(b.dataset.del!==undefined){if(confirm('この保存した文章を削除します。元に戻せません。よろしいですか？')){const a=load();a.splice(b.dataset.del,1);store(a);renderSaved();check();}}
  else if(b.id==='delall'){if(confirm('保存した文章を全部削除します。元に戻せません。よろしいですか？')){store([]);renderSaved();check();}}
  else if(b.id==='make')make();
  else if(b.id==='reset'&&confirm('選んだ内容を全部消します。よろしいですか？')){S.clear();for(const k of Object.keys(T))delete T[k];OPEN.clear();OPEN.add('外出・過ごし方');setPhase('step');Q='';KQ='';{const i=document.getElementById('kq');if(i)i.value='';}document.getElementById('nashi').checked=false;applyAge();MADE.key=null;MADE.left=[];renderLeft();document.getElementById('zenshin').value='';document.getElementById('renkei').value='';document.getElementById('renkeiCard').style.display='none';render();out();check();}
});
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.d;if(k){e.target.open?OPEN.add(k):OPEN.delete(k);
  if(!WIZ&&e.target.open&&e.target.classList.contains('slim'))document.querySelectorAll('details.slim[open]').forEach(d=>{if(d!==e.target){OPEN.delete(d.dataset.d);d.open=false;}});}},true); // 開くのは1つだけ
document.addEventListener('change',e=>{if(e.target.id==='nashi'){e.target.checked?S.add('nashiAll'):S.delete('nashiAll');out();}if(e.target.id==='midashi'){HEAD=e.target.checked;out();}if(e.target.id==='kfirst'){KFIRST=e.target.checked;out();}if(e.target.id==='atama'){ATAMA=e.target.checked;out();}if(e.target.id==='nagai'){LONG=e.target.checked;out();}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.t;if(e.target.id==='dq'){Q=e.target.value;document.getElementById('dres').innerHTML=resHtml();}else if(e.target.id==='kq'){KQ=e.target.value;renderKen();}else if(k!==undefined){T[k]=e.target.value;out();}else if(e.target.id==='zenshin')check();});
OPEN.add('外出・過ごし方');setPhase('step');renderSaved();render();out();
}
</script>
</body>
</html>
